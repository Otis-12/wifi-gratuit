<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Sculpture</title>
<style>
:root{--bg:#f2f4f6;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#10161f;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#10161f;color-scheme:dark}
html,body{height:100%;margin:0}
body{background:var(--bg);display:flex;align-items:center;justify-content:center}
img{display:block;max-width:100%;max-height:100vh;width:auto;height:auto;object-fit:contain}
</style>
</head>
<body>
<img src="image.png" alt="Sculpture en marbre d’une main dont le majeur est dressé vers un ciel bleu">
</body>
</html>
